[project]
name = "proxyveto"
version = "0.1.0"
description = "MCP proxy with JEV gatekeeper for tool call safety"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Mahbub", email = "mahbub@example.com"}
]
keywords = ["mcp", "model-context-protocol", "proxy", "security", "jev", "gatekeeper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "typer>=0.12.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0.1",
    "anyio>=4.4.0",
    "python-dotenv>=1.0.0",
]
dynamic = []

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
benchmark = [
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
proxyveto = "proxyveto.__main__:app"

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "T20", "TCH", "PTH", "ERA", "B", "PL", "SIM", "RET", "ARG", "PERF", "FLY"]
ignore = ["ANN101", "ANN102", "ANN201", "ANN202", "T201", "T203"]
fixable = ["F", "I", "UP", "C90", "W", "ERA", "B", "PL", "PTH", "SIM", "RET", "ARG"]
unfixable = ["ANN", "T20", "TCH", "PERF", "FLY"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"